services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quart-backend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - quart-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quart-frontend
    ports:
      - "30022:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - quart-network

networks:
  quart-network:
    driver: bridge
